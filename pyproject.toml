[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyvulnreach"
version = "0.1.0"
description = "Vulnerability Reachability Analyzer for Python Dependencies"
authors = [{ name = "Security Research Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
    "packaging>=23.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[project.scripts]
pyreach = "pyreach.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["tests/fixtures", "demo"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
exclude = ["tests/fixtures", "demo"]
